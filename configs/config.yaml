# Cascade-XID — single source of truth for every script and Makefile target.
# Paths are relative to the project root (the parent of this file's directory).
# Values marked PLACEHOLDER are intentionally unfitted: they must be calibrated on
# data before any result is reported.

project_name: cascade-xid
seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  kb: data/kb
  models: models
  reports: reports
  figures: reports/figures

data:
  # PLACEHOLDER: set to the dataset actually downloaded into data/raw.
  # Nothing is inferred or invented when this is null.
  dataset: null
  raw_glob: "*.csv"
  label_column: label
  flow_id_column: null
  drop_columns: []
  # Optional: sample N rows for fast development. Set to null to use all data.
  dev_sample: null
  label_map: configs/label_map.yaml

split:
  # 60 / 10 / 10 / 20, stratified on the unified multiclass label.
  # `calibration` is reserved for probability calibration and gate thresholds;
  # it is NEVER used to fit the Tier-1 model.
  train: 0.60
  val: 0.10
  calibration: 0.10
  test: 0.20
  stratify: true

preprocess:
  # inf is already converted to NaN by the loader; repeated defensively here.
  # median is the default because flow-feature distributions are heavy-tailed
  # and dropping rows would erase whole attack classes.
  impute_strategy: median          # median | mean | drop_rows
  # Feature columns missing more than this fraction IN TRAIN are dropped.
  max_column_missing_fraction: 0.30
  drop_constant_columns: true
  drop_duplicate_rows: true        # exact duplicates removed BEFORE any split
  scaling: standard                # standard | robust | none (fit on train only)
  # Class imbalance is handled with model class weights only. Rows are never
  # resampled/oversampled, and nothing is resampled before splitting.
  class_weighting: balanced        # none | balanced
  # Columns matching these regexes are identifiers that enable shortcut
  # learning (IPs, flow ids, timestamps, MACs, host addresses) and are dropped.
  # Note: `destination_port` is deliberately NOT matched and is retained; see
  # docs/PROGRESS.md (Phase 2) for the shortcut risk it carries.
  identifier_patterns:
    - "(^|_)ip(_|$)"
    - "(^|_)ips?$"
    - "(^|_)flow_id(_|$)"
    - "(^|_)timestamp(_|$)"
    - "(^|_)mac(_|$)"
    - "(^|_)address(_|$)"
    - "(^|_)src(_|$)"
    - "(^|_)dst(_|$)"
    - "(^|_)host(_|$)"
  extra_identifier_columns: []
  # Zero-day simulation: classes removed from train/val/calibration/test and
  # written to data/processed/zeroday_test.parquet. Entries may be either a
  # unified class ("Other") or a raw dataset label ("HEARTBLEED"); raw labels
  # are mapped through configs/label_map.yaml.
  #
  # Candidates proposed after inspecting the label inventory (SEMANTIC rarity;
  # measured counts are not available because data/raw is empty, so the EDA
  # numbers are "not measured"):
  #   CICIDS2017  : "HEARTBLEED", "WEB ATTACK - SQL INJECTION"
  #   CICIoT2023  : "Backdoor_Malware", "Uploading_Attack"
  # Set this list for the dataset actually loaded, then rerun preprocessing.
  zeroday_classes: []
  zeroday_max_classes: 2

tier1:
  model: random_forest        # random_forest | xgboost
  calibration: isotonic       # none | isotonic | sigmoid
  n_estimators: 300           # PLACEHOLDER, tuned in Phase 2
  max_depth: null
  n_trials: 25                # Optuna trials on the training split only

gate:
  # PLACEHOLDER thresholds; fitted on the validation split in Phase 3.
  # A flow is escalated when max predicted probability is below
  # `max_prob_threshold` OR predictive entropy exceeds `entropy_threshold`.
  max_prob_threshold: 0.75
  entropy_threshold: 1.0
  target_escalation_rate_min: 0.05
  target_escalation_rate_max: 0.15

shap:
  background_samples: 200
  max_display_features: 10

rag:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  index_path: data/kb/faiss.index
  passages_path: data/kb/passages.jsonl
  top_k: 5
  min_score: 0.0

llm:
  backend: ollama             # ollama | llamacpp
  base_url: http://localhost:11434
  model: llama3.1:8b          # any local open-weight model served by the backend
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 120
  # Guardrail: reject answers whose ATT&CK/CVE identifiers are not present in the
  # retrieved evidence (see docs/PROGRESS.md, Phase 0 decisions).
  require_grounded_ids: true
  max_retries: 1

eval:
  sample_cap: 2000            # cap on flows scored during evaluation
  bootstrap_resamples: 1000
  confidence_level: 0.95
  metrics:
    - accuracy
    - macro_f1
    - per_class_recall
    - escalation_rate
    - tier2_latency_ms
