# Cascade-XID — single source of truth for every script and Makefile target.
# Paths are relative to the project root (the parent of this file's directory).
# Values marked PLACEHOLDER are intentionally unfitted: they must be calibrated on
# data before any result is reported.

project_name: cascade-xid
seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  kb: data/kb
  models: models
  reports: reports
  figures: reports/figures

data:
  # PLACEHOLDER: set to the dataset actually downloaded into data/raw.
  # Nothing is inferred or invented when this is null.
  dataset: null
  raw_glob: "*.csv"
  label_column: label
  flow_id_column: null
  drop_columns: []
  # Optional: sample N rows for fast development. Set to null to use all data.
  dev_sample: null
  label_map: configs/label_map.yaml

split:
  # 60 / 10 / 10 / 20, stratified on the unified multiclass label.
  # `calibration` is reserved for probability calibration and gate thresholds;
  # it is NEVER used to fit the Tier-1 model.
  train: 0.60
  val: 0.10
  calibration: 0.10
  test: 0.20
  stratify: true

preprocess:
  # inf is already converted to NaN by the loader; repeated defensively here.
  # median is the default because flow-feature distributions are heavy-tailed
  # and dropping rows would erase whole attack classes.
  impute_strategy: median          # median | mean | drop_rows
  # Feature columns missing more than this fraction IN TRAIN are dropped.
  max_column_missing_fraction: 0.30
  drop_constant_columns: true
  drop_duplicate_rows: true        # exact duplicates removed BEFORE any split
  scaling: standard                # standard | robust | none (fit on train only)
  # Class imbalance is handled with model class weights only. Rows are never
  # resampled/oversampled, and nothing is resampled before splitting.
  class_weighting: balanced        # none | balanced
  # Columns matching these regexes are identifiers that enable shortcut
  # learning (IPs, flow ids, timestamps, MACs, host addresses) and are dropped.
  # Note: `destination_port` is deliberately NOT matched and is retained; see
  # docs/PROGRESS.md (Phase 2) for the shortcut risk it carries.
  identifier_patterns:
    - "(^|_)ip(_|$)"
    - "(^|_)ips?$"
    - "(^|_)flow_id(_|$)"
    - "(^|_)timestamp(_|$)"
    - "(^|_)mac(_|$)"
    - "(^|_)address(_|$)"
    - "(^|_)src(_|$)"
    - "(^|_)dst(_|$)"
    - "(^|_)host(_|$)"
  extra_identifier_columns: []
  # Zero-day simulation: classes removed from train/val/calibration/test and
  # written to data/processed/zeroday_test.parquet. Entries may be either a
  # unified class ("Other") or a raw dataset label ("HEARTBLEED"); raw labels
  # are mapped through configs/label_map.yaml.
  #
  # Candidates proposed after inspecting the label inventory (SEMANTIC rarity;
  # measured counts are not available because data/raw is empty, so the EDA
  # numbers are "not measured"):
  #   CICIDS2017  : "HEARTBLEED", "WEB ATTACK - SQL INJECTION"
  #   CICIoT2023  : "Backdoor_Malware", "Uploading_Attack"
  # Set this list for the dataset actually loaded, then rerun preprocessing.
  zeroday_classes: []
  zeroday_max_classes: 2

# Phase 3: Tier-1 candidates and benchmark.
# Hyper-parameters are tuned with Optuna on TRAIN (fit) + VALIDATION (objective)
# only. The test split is evaluated once, after every family and task has been
# tuned, and is never fed back into model selection.
tier1:
  # Default family consumed by later phases. The benchmark's selection rule
  # below names the champion in reports/tier1_benchmark.json; update this value
  # if the reported choice differs.
  model: random_forest        # random_forest | xgboost | mlp
  calibration: isotonic       # none | isotonic | sigmoid
  families: [random_forest, xgboost, mlp]
  tasks: [binary, multiclass]
  # Three seeds, per the benchmark protocol. Every fit uses one of these, and
  # results are reported as mean +/- std across them.
  seeds: [42, 43, 44]
  n_jobs: -1                    # threads for training only
  # Threads used when scoring. RF/XGBoost parallelise every predict call, so a
  # single-flow latency measured with n_jobs=-1 is all worker start-up.
  inference_n_jobs: 1
  optuna:
    n_trials: 20              # per (task, family), on validation macro-F1
    time_budget_seconds: 600  # hard wall-clock bound per (task, family)
  selection:
    # Highest mean macro-F1 subject to mean p95 single-flow latency <= 25 ms.
    metric: macro_f1          # macro_f1 | accuracy | weighted_f1
    max_p95_latency_ms: 25.0
    tie_breaker: accuracy     # accuracy | macro_f1 | weighted_f1 | p95_latency_ms
  benchmark:
    latency_calls: 1000       # single-flow calls for the latency distribution
    warmup_calls: 50
    batch_size: 1024          # batch-throughput chunk size
    throughput_max_rows: 50000
    torch_threads: 1          # fixed thread count so latency is comparable
  random_forest:
    n_estimators_max: 500
    max_depth_max: 40
    min_samples_leaf_max: 20
  xgboost:
    n_estimators_max: 500
    max_depth_max: 10
    learning_rate_min: 0.01
    learning_rate_max: 0.3
  mlp:
    # Small feed-forward networks: 2-3 ReLU hidden layers.
    hidden_layer_options:
      - [64, 32]
      - [128, 64]
      - [128, 64, 32]
    epochs: 60
    batch_size: 256
    learning_rate: 0.001
    weight_decay: 0.0001
    dropout: 0.1
    patience: 8

# Phase 4: probability calibration and the confidence gate.
# The calibrator is fitted on `calibrator_fit_split`; the gate thresholds are
# fitted on `threshold_fit_split`. Both are disjoint from train and test, and the
# fitted values are written to reports/calibration_report.json and
# reports/gate_report.json. The thresholds below stay PLACEHOLDERS until then.
gate:
  max_prob_threshold: 0.75       # PLACEHOLDER, replaced by the fitted value
  entropy_threshold: 1.0         # PLACEHOLDER, replaced by the fitted value
  target_escalation_rate_min: 0.05
  target_escalation_rate_max: 0.15
  # Score the gate with calibrated probabilities (requires `make calibrate-*`).
  use_calibrated_probabilities: true
  # `calibration` is the dedicated Phase-2 split; `val` matches the wording in
  # AGENTS.md. Either way it is disjoint from train and test.
  calibrator_fit_split: calibration   # calibration | val
  threshold_fit_split: val
  grid_steps: 101                # quantile steps per score for the threshold grid
  entropy_base: natural          # natural | bits

shap:
  background_samples: 200
  max_display_features: 10
  top_k_features: 3
  benchmark_calls: 100
  benchmark_warmup_calls: 10
  feature_dictionary_path: configs/feature_dictionary.yaml
  attack_lookup_path: configs/attack_lookup.yaml

rag:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  index_path: models/kb_index/faiss.index
  passages_path: models/kb_index/documents.jsonl
  top_k: 5
  min_score: 0.0
  chunk_tokens: 300
  overlap_tokens: 50
  embedding_batch_size: 64
  hybrid_alpha: 0.5
  cve_path: data/kb/cve_curated.csv
  retrieval_eval_path: data/kb/retrieval_eval.csv
  retrieval_report_path: reports/retrieval_eval.json

llm:
  backend: ollama             # ollama | llamacpp
  base_url: http://localhost:11434
  model: llama3.1:8b          # any local open-weight model served by the backend
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 120
  # Guardrail: reject answers whose ATT&CK/CVE identifiers are not present in the
  # retrieved evidence (see docs/PROGRESS.md, Phase 0 decisions).
  require_grounded_ids: true
  max_retries: 2                 # at most two retries after the initial call
  cache_path: models/tier2_cache.json

pipeline:
  batch_size: 256
  tier2_concurrency: 4
  run_stats_path: reports/run_stats.json

eval:
  sample_cap: 2000            # cap on flows scored during evaluation
  calibration_bins: 15        # ECE bins / reliability-diagram bins
  bootstrap_resamples: 1000
  confidence_level: 0.95
  metrics:
    - accuracy
    - macro_f1
    - per_class_recall
    - escalation_rate
    - tier2_latency_ms
